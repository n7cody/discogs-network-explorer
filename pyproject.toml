[project]
name = "discogs-network-explorer"
version = "0.2.0"
description = "Explore labels and artists on Discogs with interactive filters and network graphs"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MPL-2.0"}

dependencies = [
    "requests>=2.31.0",
    "pandas>=2.0.0",
    "matplotlib>=3.7.0",
    "networkx>=3.1",
    "streamlit>=1.36.0",
    "requests-cache>=1.2.0",
    "python-dotenv>=1.0.0",
    "google-api-python-client>=2.100.0",
    "google-auth-oauthlib>=1.1.0",
    "PyJWT>=2.8.0",
    "cryptography>=41.0.0",
    "duckdb>=1.1.0",
    "lxml>=5.0.0",
    "pyarrow>=15.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
dne = "discogs_network_explorer.__main__:main"
dne-db-update = "discogs_network_explorer.ingest.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"discogs_network_explorer" = ["*.sql"]
"discogs_network_explorer.ingest" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
